name: Desktop packages
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements-build.txt
      - name: Test desktop backend
        run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python scripts/build-desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: .build/desktop/artifacts/*
          if-no-files-found: error
