name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep
      - name: Validate project and rebuild payload
        run: ./scripts/check-project.sh
      - name: Show manifest
        run: cat manifest.env
