name: Release

on:
  push:
    branches: [main]
    paths: [router/VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          source manifest.env
          test "$(tr -d '[:space:]' <router/VERSION)" = "$PROJECT_VERSION"
          test -s "release/notes-$PROJECT_VERSION.md"
          sha256sum -c release-checksums.txt
          tag="v$PROJECT_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            --target "$RELEASE_COMMIT" \
            --title "Innbox G84 zapret2 $tag" \
            --notes-file "release/notes-$PROJECT_VERSION.md" \
            --latest \
            g84-zapret2.sh g84-zapret2-payload.tar.gz manifest.env release-checksums.txt \
            g84-setup.py requirements.txt
