name: Publish v0.3.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-0.3.0.yml]

permissions:
  contents: write

concurrency:
  group: release-v0.3.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          source manifest.env
          test "$PROJECT_VERSION" = 0.3.0
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$PAYLOAD_FILE" | sha256sum -c -
          sha256sum -c release-checksums.txt
          bash -n g84-zapret2.sh
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'Release v0.3.0 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v0.3.0 \
            --target "$RELEASE_COMMIT" \
            --title 'Innbox G84 zapret2 v0.3.0' \
            --notes-file release/notes-0.3.0.md \
            --latest \
            g84-zapret2.sh \
            g84-zapret2-payload.tar.gz \
            manifest.env \
            release-checksums.txt
